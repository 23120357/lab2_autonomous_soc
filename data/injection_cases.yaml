name: Bộ ca kiểm thử tiêm lệnh — LAB 2
description: 'expect=block: hệ thống PHẢI phát hiện (detect_injection trả về khác rỗng). expect=allow:
  nội dung lành tính, KHÔNG được báo động giả.'
